# Kick + Twitch 发现腿 · GitHub Actions 定时（2026-10-21 拆 job 并行）
#
# 2026-08~10-20 的历史：私有仓库 Actions 只有 2000 分钟/月，为省额度把 Kick/Twitch 合并成一个 job。
# 2026-10-21：仓库已迁到 **public**（Actions 免费），"省分钟"的约束消失 →
#   拆成两个并行 job：两者打的是不同平台 API、没有任何数据依赖，串行跑纯浪费
#   （实测 Kick 2m43s + Twitch 36s 串行，拆开后墙钟 ≈ 取较长者）。
#   · 两个 job 各自 restore/save 自己的重试状态（cache key 分开，互不覆盖）
#   · 优先级判定依赖两边都写完 → 单独一个 job，needs: [kick, twitch]，且每 6 小时才真跑
# 口径不变：Kick → casino 两表，Twitch → 非 casino 两表（各自脚本自带分流/去重）。
name: kick-twitch-discover

on:
  # 定时由 Cloudflare Worker `gh-discover-cron` 调 workflow_dispatch（GitHub schedule 是 best-effort）。
  workflow_dispatch:

concurrency:
  group: kick-twitch-discover
  cancel-in-progress: false     # 整个 workflow 串行（两个 job 在内部并行，表写入不打架）

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread google-auth curl_cffi

      - name: 写入服务账号凭据（来自 Secrets，不进仓库）
        env:
          SA: ${{ secrets.GSPREAD_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$SA" > .secrets/sa.json

      - name: 恢复失败重试状态
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: discover-state-kick-${{ github.run_id }}
          restore-keys: discover-state-kick-

      - name: 准备 state 目录
        run: mkdir -p state

      - name: Kick 一轮（casino 两表）
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_MAX_NEW: '200'
          KICK_MAX_PAGES: '14'      # 全站在播 ~12,135 = 13 页（1000/页），14 页留余量
          KICK_RETRY_STATE: state/kick_retry.json
          KICK_RECONCILE: state/kick_reconcile.txt
          KICK_KOL_QUOTA: '140'
          KICK_KOC_QUOTA: '60'      # KOC 保底；KOL 没用完的额度动态让给 KOC
          KICK_RPS: '3'             # 全局请求速率上限（429 治理）
          GPT_THINK_KEY: ${{ secrets.GPT_THINK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCOVER_API: https://kol-ext-gateway.wj202239010118.workers.dev
          DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
        run: |
          # casino 类目每轮跑（几十个候选，秒级）；非 casino 每 2 小时一次（几百个候选）。
          H=$(date -u +%H)
          if [ $((10#$H % 2)) -eq 0 ]; then export KICK_SCOPE=all; else export KICK_SCOPE=casino; fi
          echo "KICK_SCOPE=$KICK_SCOPE（UTC ${H} 点）"
          python3 automation/kick_discover_cloud.py --apply

      - name: 保存失败重试状态
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: discover-state-kick-${{ github.run_id }}

      # 2026-10-21(Claude/GPT 一致建议): 首要告警指标 = 排队里最老一条等了多久。
      #   不响 = 一切正常；响 = 处理能力跟不上候选产生（比"产出变少"早得多）。
      - name: 积压告警（oldest pending > 90m）
        if: always()
        env:
          DISCOVER_API: https://kol-ext-gateway.wj202239010118.workers.dev
          DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          set +e
          ST=$(curl -s -m 20 "$DISCOVER_API/discover/stats" -H "Authorization: Bearer $DISCOVER_TOKEN")
          OLD=$(printf '%s' "$ST" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('oldest_pending') or '')")
          TOTAL=$(printf '%s' "$ST" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total',0))")
          if [ -z "$OLD" ]; then echo "no pending backlog"; exit 0; fi
          AGE=$(( $(date -u +%s) - $(date -d "$OLD" +%s) ))
          echo "oldest_pending=${OLD} age=${AGE}s total=${TOTAL}"
          if [ "$AGE" -gt 5400 ] && [ -n "$LARK_WEBHOOK" ]; then
            curl -s -m 15 -X POST "$LARK_WEBHOOK" -H 'Content-Type: application/json'               -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"[discover] backlog alert: oldest pending waiting ${AGE}s, total ${TOTAL}\"}}" >/dev/null
          fi

  twitch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread google-auth curl_cffi

      - name: 写入服务账号凭据（来自 Secrets，不进仓库）
        env:
          SA: ${{ secrets.GSPREAD_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$SA" > .secrets/sa.json

      - name: 恢复失败重试状态
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: discover-state-twitch-${{ github.run_id }}
          restore-keys: discover-state-twitch-

      - name: 准备 state 目录
        run: mkdir -p state

      - name: Twitch 一轮（非 casino 两表）
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_MAX_NEW: '200'
          TWITCH_MAX_PAGES: '40'    # Just Chatting 3,851 在播 = 39 页（100/页）→ 每个类目读到底
          TWITCH_RETRY_STATE: state/twitch_retry.json
          TWITCH_RECONCILE: state/twitch_reconcile.txt
          TWITCH_KOL_QUOTA: '140'
          TWITCH_KOC_QUOTA: '100'
          DISCOVER_API: https://kol-ext-gateway.wj202239010118.workers.dev
          DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
        run: |
          H=$(date -u +%H)
          if [ $((10#$H % 2)) -eq 0 ]; then export TWITCH_SCOPE=all; else export TWITCH_SCOPE=casino; fi
          echo "TWITCH_SCOPE=$TWITCH_SCOPE（UTC ${H} 点）"
          python3 automation/twitch_discover_cloud.py --apply

      - name: 保存失败重试状态
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: discover-state-twitch-${{ github.run_id }}

  priority:
    # 依赖两条腿都写完；失败也照跑（报告用旧数据也比没有好）。
    needs: [kick, twitch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread google-auth

      - name: 写入服务账号凭据（来自 Secrets，不进仓库）
        env:
          SA: ${{ secrets.GSPREAD_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$SA" > .secrets/sa.json

      - name: 候选优先级判定（Kick + Twitch）
        # 读 4 张表 10 万行，只产出 job summary → 每 6 小时一次足够，其余轮次秒退。
        continue-on-error: true
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          COOP_SNAPSHOT_JSON: ${{ secrets.COOP_SNAPSHOT_JSON }}
        run: |
          H=$(date -u +%H)
          if [ $((10#$H % 6)) -ne 0 ]; then
            echo "⏭ 优先级判定本轮跳过（UTC ${H} 点，每 6 小时一次）"
            exit 0
          fi
          python3 automation/discover_priority_cloud.py --dry-run --top 15 \
            --json priority_cloud.json 2>&1 | tee /tmp/prio.txt
          {
            echo "## 候选优先级（Kick + Twitch）"
            echo '```'
            grep -E "已合作库|优先联系 Top|共 " /tmp/prio.txt | head -30
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
