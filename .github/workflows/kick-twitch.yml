# Kick + Twitch 合并腿 · GitHub Actions 定时（2026-10-08）
# 为什么合并：GitHub 私有仓库免费额度 2000 分钟/月，**每个 job 至少按 1 分钟计费** →
#   kick(2 分) + twitch(1 分) 分开跑每小时 = 3 分/小时 = 2160 分/月（超额度）；
#   合并成一次 runner 启动（1.3+0.5≈2 分）→ 1440 分/月，省掉重复的 setup/checkout 开销。
# 口径不变：Kick → casinoKOL/钓KOC，Twitch → 非casinoKOL/非casinoKOC（各自脚本自带分流/去重）。
# 定时：由 Cloudflare Worker gh-discover-cron 每小时调 workflow_dispatch（2026-10-09 起）。
name: kick-twitch-discover

on:
  # 2026-10-09: 定时改由 Cloudflare Worker `gh-discover-cron` 调 workflow_dispatch
  #   （GitHub schedule 是 best-effort —— 实测名义每小时、实际 5~7h 才一次 → 弃用）。
  #   见本机 ~/scripts/cf-discover-cron/。保留手动触发。
  workflow_dispatch:            # 手动触发（控制台「云端跑一轮」/ CLI）

concurrency:
  group: kick-twitch-discover
  cancel-in-progress: false     # 不并发（表写入别打架）

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread google-auth curl_cffi
      # 2026-10-20: --deep 的 YouTube 路需要 yt-dlp（抓视频描述里的商务邮箱）
      - run: pip install --quiet yt-dlp

      - name: 写入服务账号凭据（来自 Secrets，不进仓库）
        env:
          SA: ${{ secrets.GSPREAD_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$SA" > .secrets/sa.json

      - name: Kick 一轮（casino 两表）
        if: always()            # 上一步失败也要跑（两条腿互不拖累）
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_MAX_NEW: '20'        # 保持 20 —— 实测降到 12 不省时（12 候选 79s vs 20 候选 76s）：Kick 腿耗时由 LLM 单次延迟决定（12→30s 波动），与候选数弱相关；要省配额只能降**频次**，不能降每轮量
          GPT_THINK_KEY: ${{ secrets.GPT_THINK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 automation/kick_discover_cloud.py --apply

      - name: Twitch 一轮（非casino 两表）
        if: always()
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_MAX_NEW: '60'
          TWITCH_MAX_PAGES: '3'
        run: python3 automation/twitch_discover_cloud.py --apply

      # 2026-10-12: 联系方式补全一轮 —— 补「建联腿含 cloud/streamscharts 且联系方式为空」的行。
      #   背景：云腿（*-cloud）写进去的「联系方式」几乎全空，而且**没有任何腿管它们**
      #     （discover-sc-backfill.py 写死只认 streamscharts-free）。
      #   做法：Twitch → /helix/users 的 description（批量 100/次，纯 API，不抓页面）。
      #   为什么并进本 job 而不单开定时 workflow：私有仓库免费 2000 分钟/月，本 job 每小时
      #     已吃 ~2 分钟（≈1440/月）；再开一个定时 workflow 必然超额度。
      #   --days 1：云端无本地 tried 状态，只能靠时间窗口收口。取 1 天而非 3 天，
      #     是为了让「查过、确实提不到」的老行**尽快过期**，免得长期占着候选池每轮白扫。
      #     代价：Actions 若连续停摆 >1 天会漏 —— 由本机 fill-contacts.py（有 tried 记账、
      #     不限天数）兜底。
      - name: 联系方式补全一轮（发现表 *-cloud / streamscharts 空行）
        if: always()
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          # 节流：本 job 每小时被 Cloudflare Worker 调一次，但这步只在每 3 小时
          # （UTC 小时能被 3 整除时）真正执行。理由：Actions 按【每次 run 向上取整到分钟】
          # 计费，本步会再花约 1 分钟 → 每小时都跑就把 1440 顶到 2160，超私有仓库免费额度 2000/月。
          H=$(date -u +%H)
          if [ $((10#$H % 3)) -ne 0 ]; then
            echo "⏭ 本轮跳过（UTC ${H} 点，本步每 3 小时跑一次）"
            exit 0
          fi
          # 2026-10-20: 加 --deep —— 第一路（Twitch 简介）没提到联系方式时，
          #   追加 X bio / YouTube 视频描述 / link-in-bio 三路。
          #   --deep-limit 20 = 每轮最多深度抓 20 行（单行 25s 预算），
          #   实测约 +2 分钟，仍在 45 分钟 timeout 内。
          python3 automation/fill_contacts_cloud.py --apply --limit 800 --days 1 \
            --deep --deep-limit 20

      - name: 候选优先级判定（Kick + Twitch）
        # 2026-10-20: 用户要求「电脑关了也要能操作」——把本机版 discover_priority 搬到云上。
        # 数据源改成直接读 4 张发现表（15MB 候选池进不了 Secret）。
        # 默认 --dry-run：只出报告写进 job summary，**不覆盖发现表「状态」列**
        # （那列还有「在库/已合作」等语义，等确认后再开 --apply）。
        continue-on-error: true
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          COOP_SNAPSHOT_JSON: ${{ secrets.COOP_SNAPSHOT_JSON }}
        run: |
          python3 automation/discover_priority_cloud.py --dry-run --top 15 \
            --json priority_cloud.json 2>&1 | tee /tmp/prio.txt
          {
            echo "## 候选优先级（Kick + Twitch）"
            echo '```'
            grep -E "已合作库|优先联系 Top|共 " /tmp/prio.txt | head -30
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
