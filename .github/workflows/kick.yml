# Kick 发现 · GitHub Actions 定时（设备关机也能跑）
# 依赖：Kick App 凭据(Secrets) + Google 服务账号(Secret) + curl_cffi（绕 Kick 的 Cloudflare）。
# 口径同 Twitch：casino/非casino 二分 → 4 张表；KOL≥2000（高价值国家对折）→ 未达标全进 KOC；
#       语种靠聊天采样 + LLM(GPT→DeepSeek 回落)；去重主键 kick:<channel id>。
# 2026-10-08: 定时已合并到 kick-twitch.yml（省 Actions 分钟额度）；本文件只保留手动触发。
name: kick-discover

on:
  workflow_dispatch:

concurrency:
  group: kick-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet gspread google-auth curl_cffi

      - name: 写入服务账号凭据（来自 Secrets，不进仓库）
        env:
          SA: ${{ secrets.GSPREAD_SA_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$SA" > .secrets/sa.json

      - name: 跑一轮 Kick 发现
        env:
          GSPREAD_SA: .secrets/sa.json
          DISCOVER_SHEET_ID: ${{ secrets.DISCOVER_SHEET_ID }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_MAX_NEW: '20'
          GPT_THINK_KEY: ${{ secrets.GPT_THINK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 automation/kick_discover_cloud.py --apply
